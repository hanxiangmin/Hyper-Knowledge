site_name: Hyper-Knowledge
site_url: https://hanxiangmin.github.io/Hyper-Knowledge/
site_description: An Agent Skill for modeling relationships in context, tracing evidence, and exploring higher-order knowledge graphs offline.
site_author: hanxiangmin
repo_name: hanxiangmin/Hyper-Knowledge
repo_url: https://github.com/hanxiangmin/Hyper-Knowledge
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    primary: custom
    accent: custom
  logo: assets/logo/logo-icon-white.svg
  favicon: assets/logo/logo-icon.svg

extra_css:
  - stylesheets/knowledge.css

# The public handbook is authored around this Skill's own workflows.
# Retain historical runtime manuals in Git, but do not publish or index them.
exclude_docs: |
  getting-started/
  cli/
  python/
  concepts/
  templates/
  tutorials/
  resources/
  mcp.md
  assets/examples/
  assets/arch.jpg
  assets/autotypes.jpg
  assets/cli.png
  assets/en_show.jpg
  assets/hero.jpg
  assets/zh_show.jpg
  assets/showcase/
  assets/showcase-v2/.render-work/
  assets/showcase-v2/README.md
  assets/showcase-v2/live-manifest.json
  assets/showcase-v2/capture-manifest.json
  assets/showcase-v3/.render-work/
  assets/showcase-v3/README.md
  assets/showcase-v3/live-manifest.json
  assets/showcase-v3/live-qa.json
  assets/hyper-knowledge-promo-manifest.json

plugins:
  - search
  - i18n:
      docs_structure: folder
      # Shared assets live at docs/assets; the folder plugin treats them as default-locale files.
      # check_docs_site.py requires a real source page in both languages.
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav:
            - Overview: index.md
            - Use the Skill:
                - Install and verify: guide/install.md
                - Your first document: guide/document.md
            - Model in context:
                - Entities, events, and roles: guide/modeling.md
                - Evidence and bundles: guide/artifacts.md
            - Explore:
                - Three views, three questions: guide/workbench.md
                - The Su Shi walkthrough: guide/sushi.md
            - Run locally:
                - Command recipes: guide/commands.md
                - Questions and troubleshooting: guide/faq.md
            - Project: guide/about.md
        - locale: zh
          name: 简体中文
          build: true
          nav:
            - 概览: index.md
            - 使用 Skill:
                - 安装与检查: guide/install.md
                - 处理第一份文档: guide/document.md
            - 关系建模:
                - 实体、事件与角色: guide/modeling.md
                - 证据与数据包: guide/artifacts.md
            - 图谱探索:
                - 三种视图，三个问题: guide/workbench.md
                - 苏轼案例实读: guide/sushi.md
            - 本地运行:
                - 常用命令配方: guide/commands.md
                - 常见问题与排查: guide/faq.md
            - 项目说明: guide/about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hanxiangmin/Hyper-Knowledge
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
