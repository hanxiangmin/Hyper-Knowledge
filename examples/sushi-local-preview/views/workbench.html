tion:west-lake-governance-1089","node_id":"infrastructure:su-causeway","ordinal":3,"resolved":true,"role":"修筑工程"},{"assertion_id":"assertion:west-lake-governance-1089","node_id":"time:1089","ordinal":4,"resolved":true,"role":"任职与修堤年份"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"person:su-shi","ordinal":0,"resolved":true,"role":"被指控者"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"person:li-ding","ordinal":1,"resolved":true,"role":"指控者"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"person:shu-dan","ordinal":2,"resolved":true,"role":"指控者"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"person:su-zhe","ordinal":3,"resolved":true,"role":"求情者"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"person:wang-shen","ordinal":4,"resolved":true,"role":"营救者"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"place:yushitai-prison","ordinal":5,"resolved":true,"role":"拘押地点"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"time:1079","ordinal":6,"resolved":true,"role":"案件年份"},{"assertion_id":"assertion:wutai-poetry-case","node_id":"policy:new-policies","ordinal":7,"resolved":true,"role":"诗作批评对象"}],"evidence":[{"id":"evidence:anlefang-founding-hangzhou:1","line_end":43,"line_start":43,"quote":"苏轼还在杭州创立了\"安乐坊\"，这是中国历史上最早由政府创办的医院之一，专门收治贫苦病人。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:changzhou-return-1101:1","line_end":55,"line_start":55,"quote":"1101年苏轼遇赦北归，这时的他已是65岁的老人。当他到达常州时一病不起，于七月二十八日病逝。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:cold-food-calligraphy-authorship:1","line_end":59,"line_start":59,"quote":"苏轼在中国文学史上的地位无与伦比。在诗歌方面与黄庭坚并称\"苏黄\"；在词方面是豪放派开创者，与辛弃疾并称\"苏辛\"；在散文方面是\"唐宋八大家\"之一；在书法方面是\"宋四家\"之首，其《黄州寒食诗帖》被誉为\"天下第三行书\"；在绘画方面是文人画的开创者之一。苏轼发明的\"东坡肉\"至今仍是名菜。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:danzhou-exile-1097:1","line_end":51,"line_start":51,"quote":"1094年苏轼被贬惠州，写下\"日啖荔枝三百颗，不辞长作岭南人\"。1097年62岁的苏轼被一贬再贬，最后被贬至海南岛儋州。在宋代，儋州是极偏僻的地方，几乎等同于流放。但苏轼依然关心百姓，教书育人，传播中原文化。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:family-san-su:1","line_end":3,"line_start":3,"quote":"苏轼，字子瞻，号东坡居士，是北宋时期最杰出的文学家、书画家、政治家。他与父亲苏洵、弟弟苏辙并称\"三苏\"，同列唐宋八大家。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:hangzhou-appointment-1071:1","line_end":21,"line_start":21,"quote":"1071年苏轼主动请求外放，任杭州通判。在杭州期间他常常泛舟西湖，写下了著名的《饮湖上初晴后雨》：\"欲把西湖比西子，淡妆浓抹总相宜。\"后任密州知州，写下《江城子·密州出猎》，其中\"老夫聊发少年狂\"展现了他豪迈的词风。1077年任徐州知州时，黄河决口，苏轼亲自指挥抗洪抢险，成功保住徐州城。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:huangzhou-arrival-1080:1","line_end":29,"line_start":29,"quote":"最终苏轼免于一死，被贬为黄州团练副使。在押送途中，船行至长江时，苏轼曾想跳水自杀，被士兵及时拉住。他后来才知道，好友佛印禅师早就在江边等候，担心他想不开。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:huangzhou-arrival-1080:2","line_end":33,"line_start":33,"quote":"1080年苏轼抵达黄州，寄住在定慧院，后来在城东荒废的山坡上开垦种地。这片山坡后来被称为\"东坡\"，苏轼也因此自号\"东坡居士\"。团练副使是闲散官职，没有俸禄，苏轼不得不过着清贫的躬耕生活。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:huangzhou-foyin-friendship:1","line_end":37,"line_start":37,"quote":"在黄州期间，苏轼与高僧佛印禅师结为挚友。最著名的是\"八风吹不动\"的典故。苏轼写诗说自己\"八风吹不动\"，佛印只批了\"放屁\"二字。苏轼大怒过江理论，却发现门上贴着：\"八风吹不动，一屁打过江。\"苏轼恍然大悟，从此更加敬重佛印。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:huangzhou-literary-works:1","line_end":35,"line_start":35,"quote":"黄州时期是苏轼文学创作的黄金时期。他在这里创作了大量千古传诵的名篇。《念奴娇·赤壁怀古》写道：\"大江东去，浪淘尽，千古风流人物。\"这首词被誉为\"千古第一词\"，气势磅礴，成为豪放词的代表作。《前赤壁赋》描写泛舟夜游的场景，\"清风徐来，水波不兴\"，语言优美，意境深远。《定风波》写道：\"莫听穿林打叶声，何妨吟啸且徐行。一蓑烟雨任平生。\"展现了他旷达超脱的人生态度。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:huizhou-exile-1094:1","line_end":51,"line_start":51,"quote":"1094年苏轼被贬惠州，写下\"日啖荔枝三百颗，不辞长作岭南人\"。1097年62岁的苏轼被一贬再贬，最后被贬至海南岛儋州。在宋代，儋州是极偏僻的地方，几乎等同于流放。但苏轼依然关心百姓，教书育人，传播中原文化。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:imperial-exam-1057:1","line_end":15,"line_start":13,"quote":"1056年，19岁的苏轼与父亲、弟弟一起进京赶考。1057年科举考试由欧阳修担任主考官，他看到苏轼的策论文章，大为赞赏。欧阳修以为文章是自己的学生曾巩所作，为避嫌将它列为第二名。放榜后欧阳修才知道作者是苏轼，专门接见了他说：\"我应当为你让路，才能使你海阔天空地发展。\"他还预言：\"三十年后，无人再谈论老夫，将被苏轼的光芒所掩盖。\"\n\n苏轼与弟弟苏辙同科中举，后又参加制科考试被任命为大理评事。然而母亲程氏病逝，苏轼回乡守孝三年，期间专心读书写作。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:new-policies-conflict:1","line_end":19,"line_start":19,"quote":"守孝期满后，苏轼任凤翔府判官，后回京入直史馆。1067年宋神宗即位，王安石推行新法。苏轼与王安石政见不合，多次上书批评新法，认为新法过于激进，损害了百姓利益。这些批评触怒了变法派。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:san-su-tang-song-membership:1","line_end":3,"line_start":3,"quote":"苏轼，字子瞻，号东坡居士，是北宋时期最杰出的文学家、书画家、政治家。他与父亲苏洵、弟弟苏辙并称\"三苏\"，同列唐宋八大家。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:su-huang-poetry-name:1","line_end":59,"line_start":59,"quote":"苏轼在中国文学史上的地位无与伦比。在诗歌方面与黄庭坚并称\"苏黄\"；在词方面是豪放派开创者，与辛弃疾并称\"苏辛\"；在散文方面是\"唐宋八大家\"之一；在书法方面是\"宋四家\"之首，其《黄州寒食诗帖》被誉为\"天下第三行书\"；在绘画方面是文人画的开创者之一。苏轼发明的\"东坡肉\"至今仍是名菜。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:su-shi-song-four-membership:1","line_end":59,"line_start":59,"quote":"苏轼在中国文学史上的地位无与伦比。在诗歌方面与黄庭坚并称\"苏黄\"；在词方面是豪放派开创者，与辛弃疾并称\"苏辛\"；在散文方面是\"唐宋八大家\"之一；在书法方面是\"宋四家\"之首，其《黄州寒食诗帖》被誉为\"天下第三行书\"；在绘画方面是文人画的开创者之一。苏轼发明的\"东坡肉\"至今仍是名菜。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:su-xin-ci-name:1","line_end":59,"line_start":59,"quote":"苏轼在中国文学史上的地位无与伦比。在诗歌方面与黄庭坚并称\"苏黄\"；在词方面是豪放派开创者，与辛弃疾并称\"苏辛\"；在散文方面是\"唐宋八大家\"之一；在书法方面是\"宋四家\"之首，其《黄州寒食诗帖》被誉为\"天下第三行书\"；在绘画方面是文人画的开创者之一。苏轼发明的\"东坡肉\"至今仍是名菜。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:west-lake-governance-1089:1","line_end":41,"line_start":41,"quote":"1089年苏轼任杭州知州，这是他第二次到杭州。西湖多年淤积，湖面缩小。苏轼提出\"取葑泥、筑长堤\"的办法，组织民工挖掘淤泥筑起一条长长的堤坝。这条长约2.8公里的堤坝将西湖分为里湖和外湖，有效改善了水质。苏轼又在堤上种植芙蓉、杨柳，后人将这条堤称为\"苏堤\"，苏堤春晓成为\"西湖十景\"之首。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:west-lake-governance-1089:2","line_end":72,"line_start":72,"quote":"- **1089年**：任杭州知州，修筑苏堤","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:wutai-poetry-case:1","line_end":25,"line_start":25,"quote":"1079年，苏轼调任湖州知州这一年，发生了著名的\"乌台诗案\"。苏轼一直对新法持有异议，写了许多讽刺新法的诗作。御史台官员李定、舒亶等人搜集他的诗作，断章取义，指控他讪谤朝政。苏轼被押送回京，关进御史台监狱。","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"},{"id":"evidence:wutai-poetry-case:2","line_end":27,"line_start":27,"quote":"在狱中苏轼几乎以为自己必死无疑，写下了\"梦绕云山心似鹿，魂飞汤火命如鸡\"的诗句。弟弟苏辙请求以自己的官职为哥哥赎罪，好友王诜多方奔走营救。许多正直官员纷纷上书求情，已退休的欧阳修也写信说：\"陛下若杀苏轼，是诛天下之才也。\"","source":"source/sushi.md","source_sha256":"65869e3042b4a3b7a83695f1a053f8a2d99a09d031167770d4636e433442c0ed","support":"source_text_claim","type":"source_text_span"}]};
