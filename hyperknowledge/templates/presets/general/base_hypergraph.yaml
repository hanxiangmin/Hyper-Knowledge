language: [zh, en]

name: hypergraph
type: hypergraph
tags: [general, hypergraph]

description:
  zh: '通用超图结构知识模板 - 从任意文本中提取超图结构，包含节点（实体、概念、地点等）以及连接多个节点的多元关系超边（事件、会议、合作、冲突等）。'
  en: 'General-purpose Hypergraph Knowledge Template - Extracts hypergraph structure from any text, containing nodes (entities, concepts, locations, etc.) and multi-node relation hyperedges (events, meetings, cooperation, conflicts, etc.).'

output:
  description:
    zh: '提取出来的超图结构，包含节点和超边。'
    en: 'Extracted hypergraph structure containing nodes and hyperedges.'
  entities:
    description:
      zh: '文本中可独立识别的节点，如实体、概念、地点等基本语义单元。'
      en: 'Entity nodes that can be independently identified in the text, such as entities, concepts, locations, or other basic semantic units.'
    fields:
    - name: name
      type: str
      description:
        zh: '原子节点名称；人物、时间、地点分别建节点，不把年份、动作和地点拼成阶段节点。正式作品名可保留。'
        en: 'Atomic node name. Keep people, times, and places separate; do not concatenate time, action, and location into a stage node. Official work titles may remain intact.'
    - name: type
      type: str
      description:
        zh: '节点类型。例如：实体/概念/地点/组织/物品/人物/事件等'
        en: 'Node type. Examples: entity/concept/location/organization/object/person/event, etc.'
    - name: description
      type: str
      description:
        zh: '对节点身份或作用的简要说明。'
        en: 'Brief description of the node identity or role.'
      required: false
  relations:
    description:
      zh: '连接多个节点的多元关系超边，如事件、会议、合作、冲突、交易等。'
      en: 'Multi-node relation hyperedges connecting multiple nodes, such as events, meetings, cooperation, conflicts, transactions, etc.'
    fields:
    - name: name
      type: str
      description:
        zh: '简短的动作或关系标题；相同标题可以对应不同事件，身份由成员、角色和上下文区分。'
        en: 'Short action or relation title. Different events may share a title; members, roles, and context distinguish their identities.'
    - name: type
      type: str
      description:
        zh: '超边的类型。例如：会议/合作/冲突/交易/协议/比赛/选举/诉讼/并购/发布会等'
        en: 'Type of the hyperedge. Examples: meeting/collaboration/conflict/transaction/agreement/competition/election/lawsuit/acquisition/launch_event, etc.'
    - name: participants
      type: list
      description:
        zh: '兼容字段：仅填写无法归入下列角色的成员。已有角色的节点不要重复填写。'
        en: 'Compatibility field for members not covered by the roles below. Do not repeat classified nodes.'
      required: false
    - name: actors
      type: list
      description:
        zh: '事件的参与人物或行动主体节点名称。'
        en: 'Names of people or agents participating in this event.'
      required: false
    - name: objects
      type: list
      description:
        zh: '事件涉及的作品、物品、政策或研究对象节点名称。'
        en: 'Names of works, objects, policies, or subjects involved in this event.'
      required: false
    - name: times
      type: list
      description:
        zh: '仅属于本次事件的明确时间节点名称，不推测未给出的起止日期。'
        en: 'Explicit time nodes for this specific event; do not infer unstated interval endpoints.'
      required: false
    - name: places
      type: list
      description:
        zh: '仅属于本次事件的地点节点名称。'
        en: 'Place nodes belonging to this specific event.'
      required: false
    - name: organizations
      type: list
      description:
        zh: '本次关系中的组织或群体节点名称。'
        en: 'Organization or group nodes participating in this assertion.'
      required: false
    - name: outcomes
      type: list
      description:
        zh: '原文明示的结果节点名称，没有结果时留空。'
        en: 'Explicitly stated outcome nodes; leave empty if the source gives none.'
      required: false
    - name: description
      type: str
      description:
        zh: '对该超边内容或结果的简要说明。'
        en: 'Brief description of the hyperedge content or result.'
      required: false

guideline:
  target:
    zh: '你是一位关系抽取专家。请从文本中提取超图结构，包括：1）可独立识别的节点（实体、概念、地点等）；2）连接多个节点的多元关系超边（事件、会议、合作等）。'
    en: 'You are an expert in relation extraction. Extract hypergraph structure from the text, including: 1) independently identifiable nodes (entities, concepts, locations, etc.); 2) multi-node relation hyperedges (events, meetings, cooperation, etc.).'
  rules_for_entities:
    zh:
    - '提取文本中可识别的节点，如实体、概念、地点、组织、物品等基本语义单元。'
    - '同一节点在全文中保持命名一致。'
    - '不要提取纯代词、泛称或无独立指代意义的词语。'
    en:
    - 'Extract identifiable nodes from the text, such as entities, concepts, locations, organizations, objects, or other basic semantic units.'
    - 'Maintain consistent naming for the same node throughout the text.'
    - 'Do not extract pure pronouns, generic terms, or phrases without independent referential meaning.'
  rules_for_relations:
    zh:
    - '仅在文本明确表达多个节点共同参与某个事件或关系时创建超边。'
    - '避免重复超边；若多个节点多次以相同方式共同参与同一事件，应合并为一条记录。'
    - '优先使用文本中明确出现的词语描述超边内容。'
    - '用动作或关系作为超边类型，人物、时间、地点直接作为有角色的成员；两个不同节点也可构成超边，同一节点的多个角色只算一个节点。'
    - '保留有来源支持的双成员超边，不因成员少而丢弃或改成另一种拓扑；不要添加虚构成员或拼接无关事实来凑数。'
    - '不同时间、地点或条件的事件分别建立超边；不要把多个事件混成一条主题集合，也不要为美观添加原文未支持的关系。'
    en:
    - 'Create hyperedges only when the text explicitly expresses that multiple nodes jointly participate in an event or relation.'
    - 'Avoid duplicate hyperedges; if multiple nodes repeatedly participate in the same event in the same way, merge them into one record.'
    - 'Prefer words that explicitly appear in the text to describe hyperedge content.'
    - 'Use the action or relation as the hyperedge type and connect atomic members with roles; two distinct nodes can also form a hyperedge. Multiple roles for one node do not increase the distinct member count.'
    - 'Preserve supported two-member hyperedges without discarding them or changing topology based only on arity; never invent members or combine unrelated facts to increase member count.'
    - 'Separate events with different times, places, or conditions; do not merge them into a thematic collection or invent relations for visual density.'

identifiers:
  entity_id: name
  relation_id: '{name}|{type}|{actors}|{objects}|{times}|{places}|{organizations}|{outcomes}|{participants}'
  relation_members:
    actor: actors
    object: objects
    time: times
    place: places
    organization: organizations
    outcome: outcomes
    member: participants

options:
  extraction_mode: two_stage

display:
  entity_label: '{name} ({type})'
  relation_label: '{name}'
