name: Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "hyperknowledge/**/*.py"
      - "hyper-knowledge/**/*"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "hyperknowledge/**/*.py"
      - "hyper-knowledge/**/*"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff==0.15.1

      - name: Run ruff linter
        run: python -m ruff check hyperknowledge

      - name: Run ruff formatter check
        run: python -m ruff format --check hyperknowledge
