name: Lint

on:
  push:
    branches: [main, develop]
    paths:
      - "hyperknowledge/**/*.py"
      - "hyper-knowledge/**/*"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "hyperknowledge/**/*.py"
      - "hyper-knowledge/**/*"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run ruff linter
        run: uvx ruff check hyperknowledge

      - name: Run ruff formatter check
        run: uvx ruff format --check hyperknowledge
